<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account | Speedwagon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<main class="page-shell account-page">
    <nav class="topbar" aria-label="Main navigation">
        <a class="brand" href="/" aria-label="Speedwagon home">
            <span class="brand-mark">S</span>
            <span>Speedwagon</span>
        </a>
        <a class="help-link" href="/">Back to home</a>
    </nav>

    <section class="account-layout">
        <div class="account-copy">
            <p class="eyebrow"><span></span> Your shopping journey starts here</p>
            <h1>Make it <em>yours.</em></h1>
            <p class="intro">Create an account to start shopping now.</p>
        </div>

        <div class="login-card account-card" aria-labelledby="create-account-title">
            <div class="card-header">
                <span class="welcome-badge">New here?</span>
                <h2 id="create-account-title">Create your account</h2>
                <p>It only takes a minute to get started.</p>
            </div>
            <form class="login-form" action="/create-account" method="post">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="8" required>

                <label for="confirm-password">Confirm password</label>
                <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter it again" minlength="8" required>

                <label class="remember"><input type="checkbox" name="terms" required> <span>I agree to the terms and privacy policy</span></label>
                <button type="submit">Create account <span aria-hidden="true">→</span></button>
            </form>
            <p class="login-message" th:if="${accountMessage}" th:text="${accountMessage}"></p>
            <p class="signup">Already have an account? <a href="/">Sign in</a></p>
        </div>
    </section>
</main>
</body>
</html>
